name: Deploy teaser to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/travel-teaser-top-screen-o5qmsu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Collect the files to publish
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r assets _site/
          # 元データは配信しない（書き出し前の素材なので、サイトでは使わない）
          rm -rf _site/assets/img/parts
          rm -f  _site/assets/img/teaser-source.png
          find _site -type f | sort
          du -sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
