<!-- JS が動く環境でだけ、最初の一枚を暗幕で隠しておく（動かないときは静止画として表示される） -->
<script>document.documentElement.className = 'js';</script>
</head>
<body>

<!-- 画面読み込み前でも真っ黒にならないようにする下地 -->
<div class="backdrop" aria-hidden="true"></div>

<header class="topbar">
  <span class="topbar__title">Takutendo</span>
</header>

<main class="viewport" id="viewport">
  <h1 class="sr-only">仙台への冒険 ─ 60年の軌跡、ここから新たな冒険へ。2027.1.22 — 1.24　まもなく、冒険がはじまる。</h1>

  <!-- ポスター本体。すべてのエフェクトはこの中に % 座標で配置される -->
  <div class="stage" id="stage" role="img"
       aria-label="夕暮れの谷を見下ろす崖の上に立つ二人の旅人と猫の茶々丸。ティザービジュアル。">

    <div class="stage__poster" aria-hidden="true"></div>

    <!-- 文字が現れる前の「文字が無い状態」の当て板（JS が生成）。
         ポスターのすぐ上に置くので、霧や光は隠れている間も同じようにかかる。 -->
    <div class="layer plates" id="plates" aria-hidden="true"></div>

    <!-- 猫の尻尾・耳・草花（元画像の一部をそのまま動かすレイヤー。JS が生成） -->
    <div class="layer layer--patches" id="patches" aria-hidden="true"></div>

    <!-- 空を流れる雲 -->
    <div class="layer sky" aria-hidden="true">
      <div class="sky__field">
        <div class="sky__clouds sky__clouds--far"></div>
        <div class="sky__clouds sky__clouds--near"></div>
      </div>
    </div>

    <!-- 谷にたなびく霧 -->
    <div class="layer fog" aria-hidden="true">
      <span class="fog__band fog__band--1"></span>
      <span class="fog__band fog__band--2"></span>
      <span class="fog__band fog__band--3"></span>
    </div>

    <!-- 夕日の光と、差し込む光条 -->
    <div class="layer sunlight" aria-hidden="true">
      <span class="sunlight__bloom"></span>
      <span class="sunlight__rays"></span>
    </div>

    <!-- 地図アイコンの明滅 -->
    <div class="layer mapglow" aria-hidden="true">
      <span class="mapglow__sheen"></span>
      <span class="mapglow__halo"></span>
    </div>

    <!-- 漂う光の粒（JS が少量ずつ生成） -->
    <div class="layer motes" id="motes" aria-hidden="true"></div>

    <!-- 最初の一枚が浮かび上がるまでの暗幕 -->
    <div class="layer reveal" id="reveal" aria-hidden="true">
      <div class="curtain"></div>
    </div>
  </div>
</main>

<script src="assets/js/teaser.js" defer></script>
</body>
</html>
