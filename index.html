<body>

<div class="backdrop" aria-hidden="true"></div>

<!-- BGM。押されるまで読み込まない（ブラウザは無操作では音を鳴らせない） -->
<audio id="bgm" src="assets/audio/theme.mp3" loop preload="none" playsinline></audio>

<button class="sound" id="sound" type="button" aria-pressed="false" aria-label="音を鳴らす">
  <svg viewBox="0 0 32 32" aria-hidden="true">
    <path class="sound__body" d="M7 12.5h4.4L17 7.6v16.8l-5.6-4.9H7z"/>
    <g class="sound__wave">
      <path d="M20.6 12.2a5.4 5.4 0 0 1 0 7.6"/>
      <path d="M23.5 9.2a9.5 9.5 0 0 1 0 13.6"/>
    </g>
    <path class="sound__slash" d="M20.8 12.2 L27.4 19.8 M27.4 12.2 L20.8 19.8"/>
  </svg>
</button>

<main class="viewport">
  <h1 class="sr-only">FUTURE FANTASY ─未来の地図─　60年の軌跡、ここから新たな冒険へ。─舞台は仙台。2027.1.22-24　A new adventure is coming…</h1>

  <!-- 1. 黒画面の中央に置かれ、霧のように消える 60TH -->
  <div class="herald" id="herald" aria-hidden="true">
    <img class="herald__img" src="assets/img/hero/crest.webp" alt="" decoding="async">
  </div>

  <!-- 完成形と同じ縦横比の枠。中の配置はすべて % 指定 -->
  <div class="stage" id="stage">

    <div class="scene" aria-hidden="true">
      <div class="scene__img"></div>
      <div class="scene__sky"></div>
      <div class="scene__sun"></div>
      <div class="scene__scrim"></div>
    </div>

    <div class="motes" id="motes" aria-hidden="true"></div>

    <!-- 1. 60TH。黒画面のうちから出て、そのまま左上に居続ける -->
    <div class="crest el" data-step="crest" aria-hidden="true">
      <div class="crest__glow"></div>
      <img class="crest__img" src="assets/img/hero/crest.webp" alt="" decoding="async">
    </div>

    <!-- 3. FUTURE FANTASY -->
    <div class="logo el" data-step="logo" aria-hidden="true">
      <div class="logo__flash"></div>
      <img class="logo__img" src="assets/img/hero/logo.webp" alt="" decoding="async">
      <div class="logo__sheen"></div>
    </div>

    <!-- 4. 文字を一行ずつ -->
    <div class="lead" aria-hidden="true">
      <img class="lead__l1 el" data-step="lead1" src="assets/img/hero/lead1.webp" alt="" decoding="async">
      <img class="lead__l2 el" data-step="lead2" src="assets/img/hero/lead2.webp" alt="" decoding="async">
    </div>

    <span class="rule rule--1 el" data-step="rule1" aria-hidden="true"></span>

    <img class="date el" data-step="date" src="assets/img/hero/date.webp" alt="" decoding="async" aria-hidden="true">

    <span class="rule rule--2 el" data-step="rule2" aria-hidden="true"></span>

    <img class="coming el" data-step="coming" src="assets/img/hero/coming.webp" alt="" decoding="async" aria-hidden="true">
  </div>
</main>

<script src="assets/js/hero.js" defer></script>
</body>
</html>
